name: Build COS17 r8s V3 kernel
on:
  workflow_dispatch:
  push:
    branches: [cos17-r8s-v3-close-range-20261110]
    paths: ["cos17/**", ".github/workflows/build.yml"]
permissions:
  contents: read
concurrency:
  group: cos17-r8s-kernel-${{ github.ref }}
  cancel-in-progress: false
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: recursive
      - name: Install kernel prerequisites
        run: |
          sudo -n apt-get update
          sudo -n env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential cpio curl flex git libc++1 libc++abi1 \
            libelf-dev libssl-dev lld python3 rsync unzip xz-utils zip
      - name: Add build swap
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 8
      - name: Build r8s only
        run: bash cos17/build.sh
      - name: Keep build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cos17-r8s-kernel-log
          path: out/cos17-kernel-build.log
          if-no-files-found: ignore
          retention-days: 5
      - name: Keep verified kernel components
        uses: actions/upload-artifact@v4
        with:
          name: cos17-r8s-v3-close-range-${{ github.sha }}
          path: out/cos17-artifacts/
          if-no-files-found: error
          compression-level: 1
          retention-days: 5
